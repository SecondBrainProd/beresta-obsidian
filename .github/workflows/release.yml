# Выпуск плагина: сборка на стороне GitHub, а не с чьей-то машины.
#
# ⚠️ Заведено 20260915 по замечанию проверки каталога Obsidian: «Missing GitHub
# artifact attestations for release assets». Свидетельство происхождения
# (build provenance) даёт человеку способ проверить КРИПТОГРАФИЧЕСКИ, что
# `main.js` в релизе собран из исходников этого репозитория, а не подложен.
# Для плагина, который читает и пишет заметки в хранилище человека, это не
# украшение.
#
# Побочная польза, ради которой это стоило сделать и без каталога: релиз больше
# не зависит от того, что лежало на машине выпускающего. Тег — единственная
# кнопка.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Прогон ДО сборки: релиз, собранный из красного дерева, хуже отсутствия
      # релиза — он расходится с тем, что проверено.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # Тег и версия манифеста обязаны совпадать: каталог берёт версию из
      # манифеста, а файлы — из релиза с таким же тегом. Разойдутся — человек
      # поставит одно, а увидит другое.
      - name: Сверить тег с версией манифеста
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "тег $tag не совпадает с версией манифеста $version" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            main.js manifest.json styles.css
